apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: dnd
  labels:
    name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway-pod
        image: gateway:1.0.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "256Mi"
            cpu: "256m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000
        env:
        - name: API_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: api-url
        - name: WS_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: ws-config
              key: ws-url
        - name: CORS_ORIGIN
          value: '[http://127.0.0.1:80,http://vue-service:80,http://192.168.49.2:30080,*]'
        - name: GATEWAY_PORT
          valueFrom:
            configMapKeyRef:
              name: gateway-config
              key: gateway-port
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000

