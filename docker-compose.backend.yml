services:
  gateway:
    build:
      context: ./backend/gateway-server
      dockerfile: Dockerfile
    container_name: gateway-server
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      - API_SERVER_URL=http://api:${API_PORT}
      - WS_SERVER_URL=http://ws:${WS_PORT}
      - GATEWAY_PORT=${GATEWAY_PORT}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - api
      - ws
    networks:
      - backend-network
    restart: unless-stopped

  api:
    build:
      context: ./backend/API-server
      dockerfile: Dockerfile
    container_name: api-server
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      - MONGO_URL_WEB=${MONGO_URL_WEB}
      - MONGO_URL_LOCAL=${MONGO_URL_LOCAL}
      - DB_LOCAL=${DB_LOCAL}
      - FIREBASE_URL=${FIREBASE_URL}
      - API_PORT=${API_PORT}
      - CORS_ORIGIN_API=${CORS_ORIGIN_API}
    networks:
      - backend-network
    restart: unless-stopped

  ws:
    build:
      context: ./backend/WS-server
      dockerfile: Dockerfile
    container_name: ws-server
    ports:
      - "${WS_PORT}:${WS_PORT}"
    environment:
      - MONGO_URL_WEB=${MONGO_URL_WEB}
      - MONGO_URL_LOCAL=${MONGO_URL_LOCAL}
      - DB_LOCAL=${DB_LOCAL}
      - WS_PORT=${WS_PORT}
      - CORS_ORIGIN_WS=${CORS_ORIGIN_WS}
    networks:
      - backend-network
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge
