{{- $releaseName := .Release.Name -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $releaseName }}-ws-deployment
  namespace: {{ .Values.app.namespace }}
  labels:
    app: {{ $releaseName }}-ws
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ $releaseName }}-ws
  template:
    metadata:
      labels:
        app: {{ $releaseName }}-ws
    spec:
      containers:
      - name: {{ $releaseName }}-ws-pod
        image: "{{ .Values.backend.ws.repo }}:{{ .Values.backend.ws.tag }}"
        imagePullPolicy: {{ .Values.backend.imagePullPolicy }}
        resources:
          requests:
            memory: {{ .Values.backend.resources.requests.memory | quote }}
            cpu: {{ .Values.backend.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.backend.resources.limits.memory | quote }}
            cpu: {{ .Values.backend.resources.limits.cpu | quote }}
        ports:
        - containerPort: {{ .Values.backend.ws.port }}
        env:
        - name: DB_LOCAL
          valueFrom:
            configMapKeyRef:
              name: {{ $releaseName }}-mongo-config
              key: local
        - name: MONGO_URL_LOCAL
          valueFrom:
            configMapKeyRef:
              name: {{ $releaseName }}-mongo-config
              key: mongo-url
        - name: CORS_ORIGIN_WS
          valueFrom:
            configMapKeyRef:
              name: {{ $releaseName }}-gateway-config
              key: gateway-url
        - name: PORT
          value: {{ .Values.backend.ws.port | quote }}
