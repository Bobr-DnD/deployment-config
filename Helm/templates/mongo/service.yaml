{{- $releaseName := .Release.Name -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ $releaseName }}-mongo-service
  namespace: {{ .Values.app.namespace }}
  labels:
    app: {{ $releaseName }}-mongo
spec:
  type: ClusterIP
  selector:
    app: {{ $releaseName }}-mongo
  ports:
  - protocol: TCP
    port: {{ .Values.mongo.port }}
    targetPort: {{ .Values.mongo.port }}