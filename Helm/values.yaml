backend:
  replicaCount: 1
  imagePullPolice: IfNotPresent
  cors: '[http://127.0.0.1:80,http://vue-service:80,*]'
  gateway:
    port: 3000
    repo: gateway
    tag: 1.0.0
  api:
    port: 3001
    repo: api
    tag: 1.0.1
  ws:
    port: 3002
    repo: ws
    tag: 1.0.0
  resources:
    requests:
      memory: 256Mi
      cpu: 256m
    limits:
      memory: 512Mi
      cpu: 512m

frontend:
  replicaCount: 1
  repo: vue
  tag: 1.1.3
  port: 80
  imagePullPolicy: IfNotPresent
  credentials: "mongo-secret"
  resources:
    requests:
      memory: 128Mi
      cpu: 256m
    limits:
      memory: 256Mi
      cpu: 500m

mongo:
  replicaCount: 1
  repo: mongo
  tag: noble
  port: 27017
  storage: 1Gi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1024Mi
      cpu: 500m

app:
  namespace: dnd
  hostname: dnd.local